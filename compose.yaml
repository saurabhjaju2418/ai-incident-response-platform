services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
    ports: ["5432:5432"]
    volumes: ["beacon-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/beacon
      DATABASE_USER: beacon
      DATABASE_PASSWORD: beacon
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  beacon-data:

